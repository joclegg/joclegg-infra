name: Terraform

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # Weekly, every folder: picks up time-based changes such as the Azure client
  # secret's rotation, and shows drift.
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

# One run at a time, so an apply never races a plan for a state lock.
concurrency:
  group: terraform
  cancel-in-progress: false

jobs:
  # Each top-level folder with a versions.tf is its own root and workspace.
  # Only changed roots run, unless modules/ or this workflow changed, or the
  # run was started by hand or by the schedule.
  roots:
    runs-on: ubuntu-latest
    outputs:
      roots: ${{ steps.find.outputs.roots }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: find
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Roots run one at a time in this order, so each one runs after the
          # roots whose outputs it reads: supabase/ reads azure/ and mailgun/,
          # cloudflare/ reads mailgun/, and github/ reads cloudflare/. A new
          # root not listed here runs last.
          order="hcp azure mailgun supabase cloudflare github"
          found=$(ls -d */versions.tf 2>/dev/null | xargs -n1 dirname | grep -vx modules || true)
          all=$(for r in $order; do grep -qx "$r" <<<"$found" && echo "$r"; done; grep -vxF -f <(tr ' ' '\n' <<<"$order") <<<"$found" || true)
          if [ "$EVENT" = workflow_dispatch ] || [ "$EVENT" = schedule ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            roots=$all
          else
            changed=$(git diff --name-only "$BASE" HEAD)
            if grep -qE '^(modules/|\.github/workflows/terraform\.yml$)' <<<"$changed"; then
              roots=$all
            else
              roots=$(for r in $all; do grep -q "^$r/" <<<"$changed" && echo "$r"; done || true)
            fi
          fi
          echo "roots=$(jq -cn '$ARGS.positional' --args $roots)" >> "$GITHUB_OUTPUT"
          echo "Roots: ${roots:-none}"

  plan-apply:
    needs: roots
    if: needs.roots.outputs.roots != '[]'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        root: ${{ fromJSON(needs.roots.outputs.roots) }}
    name: ${{ matrix.root }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # GitHub's OIDC token, for azure/ to sign in to Microsoft Entra ID.
      id-token: write
    env:
      # Every root stores its state in HCP Terraform and reads other roots' outputs.
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
      TFE_TOKEN: ${{ secrets.TF_API_TOKEN }}
      # Each value below is set only for the root that needs it, so no root
      # sees another's credentials.
      #
      # azure/ signs in as the joclegg-infra-github app registration with
      # GitHub's OIDC token. Neither ID is secret.
      ARM_USE_OIDC: ${{ matrix.root == 'azure' && 'true' || '' }}
      ARM_CLIENT_ID: ${{ matrix.root == 'azure' && vars.AZURE_CLIENT_ID || '' }}
      ARM_TENANT_ID: ${{ matrix.root == 'azure' && vars.AZURE_TENANT_ID || '' }}
      # mailgun/
      MAILGUN_API_KEY: ${{ matrix.root == 'mailgun' && secrets.MAILGUN_API_KEY || '' }}
      # supabase/ signs in with the same token puzzles-backend uses.
      SUPABASE_ACCESS_TOKEN: ${{ matrix.root == 'supabase' && secrets.SUPABASE_ACCESS_TOKEN || '' }}
      # cloudflare/, plus the merge webhook Worker's GitHub App.
      CLOUDFLARE_API_TOKEN: ${{ matrix.root == 'cloudflare' && secrets.CLOUDFLARE_API_TOKEN || '' }}
      TF_VAR_REPO_DISPATCH_APP_CLIENT_ID: ${{ matrix.root == 'cloudflare' && vars.REPO_DISPATCH_APP_CLIENT_ID || '' }}
      TF_VAR_REPO_DISPATCH_APP_KEY: ${{ matrix.root == 'cloudflare' && secrets.REPO_DISPATCH_APP_KEY || '' }}
      # github/: a fine-grained token for the provider, and the values
      # github/secrets.tf copies to the other repositories.
      GITHUB_TOKEN: ${{ matrix.root == 'github' && secrets.INFRA_GITHUB_TOKEN || '' }}
      TF_VAR_SUPABASE_ACCESS_TOKEN: ${{ matrix.root == 'github' && secrets.SUPABASE_ACCESS_TOKEN || '' }}
      TF_VAR_PUZZLES_KEYSTORE_BASE64: ${{ matrix.root == 'github' && secrets.PUZZLES_KEYSTORE_BASE64 || '' }}
      TF_VAR_PUZZLES_KEYSTORE_PASSWORD: ${{ matrix.root == 'github' && secrets.PUZZLES_KEYSTORE_PASSWORD || '' }}
      TF_VAR_PUZZLES_KEY_ALIAS: ${{ matrix.root == 'github' && secrets.PUZZLES_KEY_ALIAS || '' }}
      TF_VAR_PUZZLES_KEY_PASSWORD: ${{ matrix.root == 'github' && secrets.PUZZLES_KEY_PASSWORD || '' }}
      TF_IN_AUTOMATION: 'true'
    defaults:
      run:
        # Explicit bash adds pipefail, so a failing plan isn't hidden by tee.
        shell: bash
        working-directory: ${{ matrix.root }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false
      - name: Check formatting
        run: terraform fmt -check -recursive
      - name: Init
        run: terraform init -input=false
      - name: Validate
        run: terraform validate
      - name: Plan
        run: |
          terraform plan -input=false -no-color -out=tfplan | tee plan.txt
          {
            echo "## Terraform plan: ${{ matrix.root }}"
            echo '```'
            cat plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Apply
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: terraform apply -input=false tfplan

  # The one check for branch protection to require, whichever roots ran.
  terraform:
    needs: [roots, plan-apply]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        env:
          ROOTS: ${{ needs.roots.result }}
          RUNS: ${{ needs.plan-apply.result }}
        run: |
          echo "roots: $ROOTS, plan-apply: $RUNS"
          [ "$ROOTS" = success ] && { [ "$RUNS" = success ] || [ "$RUNS" = skipped ]; }
